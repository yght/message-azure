# Build, test, then deploy dev automatically and prod behind an approval.
#
# The what-if step on production is the important one. Bicep is declarative
# and a template change can quietly propose deleting a database; what-if puts
# that in front of a human before the approval gate rather than after.

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/*

variables:
  buildConfiguration: 'Release'
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: $(vmImage)
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '6.0.x'

          - script: dotnet build src/MessagePlatform.Notifications.sln -c $(buildConfiguration) --warnaserror
            displayName: 'Build'

          # Warnings are errors here on purpose. A nullable warning that gets
          # ignored for six months is a null reference in production.

          - script: >
              dotnet test src/MessagePlatform.Notifications.sln
              -c $(buildConfiguration)
              --no-build
              --logger trx
              --collect:"XPlat Code Coverage"
            displayName: 'Test'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'

          - script: |
              az bicep build --file infra/main.bicep --stdout > /dev/null
            displayName: 'Compile Bicep'

          - script: >
              dotnet publish src/MessagePlatform.Notifications.Functions
              -c $(buildConfiguration)
              -o $(Build.ArtifactStagingDirectory)/functions
            displayName: 'Publish function app'

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: drop

          - publish: infra
            artifact: infra

  - stage: DeployDev
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: Dev
        pool:
          vmImage: $(vmImage)
        environment: 'message-platform-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureResourceManagerTemplateDeployment@3
                  inputs:
                    deploymentScope: 'Resource Group'
                    azureResourceManagerConnection: 'msgplat-dev'
                    resourceGroupName: 'rg-msgplat-dev'
                    location: 'canadacentral'
                    csmFile: '$(Pipeline.Workspace)/infra/main.bicep'
                    csmParametersFile: '$(Pipeline.Workspace)/infra/parameters/dev.parameters.json'
                    deploymentMode: 'Incremental'

                - task: AzureFunctionApp@1
                  inputs:
                    azureSubscription: 'msgplat-dev'
                    appType: 'functionAppLinux'
                    appName: 'msgplat-dev-fn'
                    package: '$(Pipeline.Workspace)/drop/functions'

  - stage: DeployProd
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - job: WhatIf
        pool:
          vmImage: $(vmImage)
        steps:
          - task: AzureCLI@2
            displayName: 'What-if against production'
            inputs:
              azureSubscription: 'msgplat-prod'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: >
                az deployment group what-if
                --resource-group rg-msgplat-prod
                --template-file $(Pipeline.Workspace)/infra/main.bicep
                --parameters @$(Pipeline.Workspace)/infra/parameters/prod.parameters.json

      - deployment: Prod
        dependsOn: WhatIf
        pool:
          vmImage: $(vmImage)
        # The environment carries the approval check. The what-if output is
        # in the log above it, so whoever approves has actually seen the diff.
        environment: 'message-platform-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureResourceManagerTemplateDeployment@3
                  inputs:
                    deploymentScope: 'Resource Group'
                    azureResourceManagerConnection: 'msgplat-prod'
                    resourceGroupName: 'rg-msgplat-prod'
                    location: 'canadacentral'
                    csmFile: '$(Pipeline.Workspace)/infra/main.bicep'
                    csmParametersFile: '$(Pipeline.Workspace)/infra/parameters/prod.parameters.json'
                    deploymentMode: 'Incremental'

                - task: AzureFunctionApp@1
                  inputs:
                    azureSubscription: 'msgplat-prod'
                    appType: 'functionAppLinux'
                    appName: 'msgplat-prod-fn'
                    package: '$(Pipeline.Workspace)/drop/functions'
                    deploymentMethod: 'zipDeploy'
